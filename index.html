<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DS Safety Systems | Advanced Fire Protection & Safety Solutions in New Delhi</title>

  <!-- SEO Meta Tags -->
  <meta name="description" content="DS Safety Systems provides certified fire protection equipment, installation, and Annual Maintenance Contracts (AMC) in New Delhi. Expert safety solutions for commercial and residential properties.">
  <meta name="keywords" content="Fire Safety Systems, Fire Extinguishers, Fire Alarms, Hydrant Systems, AMC Fire Maintenance, DS Safety Systems Delhi">

  <!-- Open Graph / Social Sharing Meta Tags -->

  <!-- Import Poppins Google Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    /* Global Reset & Apply Poppins Font */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', Arial, sans-serif;
    }

    html, body {
      width: 100%;
      min-height: 100vh;
      background-color: #ffffff;
      margin: 0;
      padding: 0;
      overflow-x: hidden;
    }

    /* Top Utility Bar */
    .top-bar {
      width: 100%;
      background-color: #161616;
      color: #fff;
      height: 76px;
      padding: 0 40px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: nowrap;
    }

    .top-bar-left, .top-bar-right {
      display: flex;
      align-items: center;
      gap: 40px;
    }

    .info-item, .top-bar-right > a {
      opacity: 0;
      animation: pureFadeIn 1.1s ease forwards;
    }

    .top-bar-left .info-item:nth-child(1) { animation-delay: 0.1s; }
    .top-bar-left .info-item:nth-child(2) { animation-delay: 0.25s; }
    .top-bar-left .info-item:nth-child(3) { animation-delay: 0.4s; }
    .top-bar-right a:nth-child(1) { animation-delay: 0.55s; }
    .top-bar-right a:nth-child(2) { animation-delay: 0.7s; }

    @keyframes pureFadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .info-item {
      display: flex;
      align-items: center;
      color: #fff;
      font-size: 15px;
      font-weight: 600;
      text-decoration: none;
    }

    .info-item.location-item {
      gap: 2px;
    }

    .info-item:not(.location-item) {
      gap: 12px;
    }

    .info-item img {
      width: 18px;
      height: 18px;
      object-fit: contain;
      filter: brightness(0) invert(1);
    }

    .top-bar a {
      color: #fff;
      text-decoration: none;
      font-size: 15px;
      font-weight: 600;
      transition: color 0.2s ease;
    }

    .top-bar a:hover {
      color: #d1d5db;
    }

    .btn-contact {
      background-color: #dc2626;
      color: white;
      padding: 10px 22px;
      font-weight: 600;
      text-decoration: none;
      font-size: 15px;
      transition: background-color 0.2s ease;
    }

    .btn-contact:hover {
      background-color: #b91c1c;
      color: white;
    }

    /* Main Navigation Container */
    .nav-container {
      width: 100%;
      display: flex;
      justify-content: center;
      padding: 14px 18px;
      background-color: #ffffff;
    }

    /* Shared Circling Aura Effect (Slow, hanging around speed at 10s with red/orange gradient line) */
    .aura-wrapper {
      position: relative;
      display: inline-block;
      padding: 2.5px;
      border-radius: 16.5px;
      overflow: hidden;
      box-shadow: 0 0 20px rgba(220, 38, 38, 0.25);
    }

    .aura-wrapper::before {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      width: 300%;
      height: 300%;
      transform: translate(-50%, -50%);
      background: conic-gradient(
        from 0deg, 
        transparent 0%, 
        transparent 25%, 
        #dc2626 40%, 
        #f97316 50%, 
        #dc2626 60%, 
        transparent 75%, 
        transparent 100%
      );
      animation: borderRotate 10s linear infinite;
    }

    /* Specific wrapper width for the main nav bar */
    .nav-aura-wrapper {
      width: 100%;
      max-width: 1420px;
    }

    @keyframes borderRotate {
      0% { transform: translate(-50%, -50%) rotate(0deg); }
      100% { transform: translate(-50%, -50%) rotate(360deg); }
    }

    /* Main Navigation Bar */
    .main-nav {
      width: 100%;
      background-color: #ffffff;
      border-radius: 14px;
      height: 80px;
      padding: 0 36px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: relative;
      overflow: hidden;
      z-index: 1;
      
      transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* Inside Bar Sweeping Shimmer Effect */
    .main-nav::after {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(
        90deg, 
        transparent, 
        rgba(0, 0, 0, 0.02), 
        rgba(255, 255, 255, 0.5), 
        rgba(0, 0, 0, 0.02), 
        transparent
      );
      transition: none;
      z-index: 0;
    }

    .nav-aura-wrapper:hover .main-nav::after {
      animation: insideBarSweep 1.2s cubic-bezier(0.4, 0, 0.2, 1) forwards;
    }

    @keyframes insideBarSweep {
      0% { left: -100%; }
      100% { left: 100%; }
    }

    .brand-logo, .nav-links, .nav-right {
      position: relative;
      z-index: 1;
    }

    /* Brand Logo & Company Name */
    .brand-logo {
      display: flex;
      align-items: center;
      gap: 16px;
      text-decoration: none;
      white-space: nowrap;
    }

    .brand-logo img {
      width: 50px;
      height: 50px;
      object-fit: contain;
    }

    .brand-title {
      font-size: 25px;
      font-weight: 700;
      background: linear-gradient(135deg, #111827 30%, #dc2626 70%, #f97316 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: -0.4px;
    }

    /* Centered Nav Links */
    .nav-links {
      display: flex;
      align-items: center;
      gap: 14px;
      list-style: none;
      margin: 0 auto;
    }

    .nav-links a {
      position: relative;
      text-decoration: none;
      color: #4b5563;
      font-size: 15px;
      font-weight: 500;
      padding: 8px 16px;
      border-radius: 8px;
      background-color: transparent;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      display: flex;
      align-items: center;
      gap: 6px;
      transform: none;
    }

    /* Uniform Hover State for All Links */
    .nav-links a:hover {
      color: #dc2626;
      background-color: rgba(220, 38, 38, 0.06);
      border-radius: 10px;
      transform: translateY(-2px);
    }

    /* Active State for Home */
    .nav-links a.active {
      color: #4b5563;
      font-weight: 500;
      background-color: transparent;
      border-radius: 8px;
      text-shadow: none;
      animation: none;
      transform: none;
    }

    .nav-links a.active:hover {
      color: #dc2626;
      background-color: rgba(220, 38, 38, 0.06);
      border-radius: 10px;
      transform: translateY(-2px);
    }

    .nav-links a svg {
      width: 15px;
      height: 15px;
      fill: currentColor;
      transition: transform 0.3s ease;
    }

    .nav-links a:hover svg {
      transform: translateY(2px) rotate(180deg);
    }

    /* Right Actions */
    .nav-right {
      display: flex;
      align-items: center;
    }

    /* Get a quote button wrapper with the same slow circulating border */
    .quote-aura-wrapper {
      border-radius: 12.5px;
    }

    .card.bg-base-100 {
      background-color: #ffffff;
      border-radius: 10px;
      position: relative;
      z-index: 1;
    }

    .card-body {
      padding: 0;
    }

    .btn-get-started {
      background-color: #161616;
      color: #ffffff;
      padding: 10px 22px;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 600;
      text-decoration: none;
      display: inline-block;
      transition: background-color 0.2s ease, transform 0.2s ease;
      position: relative;
      z-index: 2;
    }

    .btn-get-started:hover {
      background-color: #333333;
      transform: translateY(-1px);
    }
  </style>
</head>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DS Safety Systems | Advanced Fire Protection & Safety Solutions in New Delhi</title>

  <!-- SEO Meta Tags -->
  <meta name="description" content="DS Safety Systems provides certified fire protection equipment, installation, and Annual Maintenance Contracts (AMC) in New Delhi. Expert safety solutions for commercial and residential properties.">
  <meta name="keywords" content="Fire Safety Systems, Fire Extinguishers, Fire Alarms, Hydrant Systems, AMC Fire Maintenance, DS Safety Systems Delhi">

  <!-- Open Graph / Social Sharing Meta Tags -->
  <meta property="og:title" content="DS Safety Systems | Fire Protection Experts">
  <meta property="og:description" content="Professional fire safety equipment, installation, and AMC services in New Delhi.">
  <meta property="og:type" content="website">

  <!-- Import Outfit Font (Weight 700) and Lato -->
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@700&family=Lato:wght@400;700&display=swap" rel="stylesheet">

  <style>
    /* Global Reset & Apply Font */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Lato', Arial, sans-serif;
    }

    html {
      scroll-behavior: smooth;
    }

    /* Top Utility Bar */
    .top-bar {
      background-color: #1a1a1a;
      color: #fff;
      padding: 12px 25px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 15px;
    }

    .top-bar-left, .top-bar-right {
      display: flex;
      align-items: center;
      gap: 25px;
      flex-wrap: wrap;
    }

    .info-item, .top-bar-right > a {
      opacity: 0;
      animation: pureFadeIn 1.1s ease forwards;
    }

    .top-bar-left .info-item:nth-child(1) { animation-delay: 0.1s; }
    .top-bar-left .info-item:nth-child(2) { animation-delay: 0.25s; }
    .top-bar-left .info-item:nth-child(3) { animation-delay: 0.4s; }
    .top-bar-right a:nth-child(1) { animation-delay: 0.55s; }
    .top-bar-right a:nth-child(2) { animation-delay: 0.7s; }

    @keyframes pureFadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .info-item {
      display: flex;
      align-items: center;
      gap: 10px;
      color: #fff;
      font-size: 16px;
      font-weight: 700;
      text-decoration: none;
    }

    .info-item img {
      width: 20px;
      height: 20px;
      filter: invert(1);
    }

    .top-bar a {
      color: #fff;
      text-decoration: none;
      font-size: 16px;
    }

    .btn-contact {
      background-color: #d93830;
      color: white;
      padding: 10px 20px;
      border-radius: 4px;
      font-weight: bold;
      text-decoration: none;
      font-size: 16px;
      transition: background-color 0.3s ease;
    }

    .btn-contact:hover {
      background-color: #b52b24;
    }
